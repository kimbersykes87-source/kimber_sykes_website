name = "kimber-sykes-crawler-logger"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Forward to your deployed Pages project origin (no trailing slash).
# Create this as an environment variable in the dashboard or: wrangler secret put / vars
[vars]
# Use the Pages *.pages.dev origin — not the custom domain (worker routes on kimbersykes.com would loop).
PAGES_ORIGIN = "https://kimber-sykes-site.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "kimber-sykes-analytics"
database_id = "6ebdf4a1-6add-4cf1-a80e-1999e2fb4d68"

[[routes]]
pattern = "kimbersykes.com/*"
zone_name = "kimbersykes.com"

[[routes]]
pattern = "www.kimbersykes.com/*"
zone_name = "kimbersykes.com"
